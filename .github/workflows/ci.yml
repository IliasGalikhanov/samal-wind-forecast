name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep private data out of the repository
        run: |
          python scripts/check_publication.py --history
          python scripts/check_docs.py
          python -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go format, vet and tests
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
      - name: Python tests (no external API)
        run: |
          python -m pip install -r ml/requirements.lock.txt
          python -m pytest ml -q
      - name: Full synthetic training and model reuse (offline)
        run: |
          python scripts/demo.py --verify --output runtime/portfolio-demo
          python scripts/portfolio_report.py --output runtime/ci-report
      - name: TypeScript and frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run build
      - name: Browser workflows with isolated synthetic data
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Synthetic audit report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-audit
          path: runtime/ci-report/
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean container
        run: docker compose build
      - name: Start and verify the application
        run: |
          docker compose up -d --wait --wait-timeout 120
          python scripts/smoke.py --url http://127.0.0.1:8080
          docker compose restart app
          docker compose up -d --wait --wait-timeout 120
          python scripts/smoke.py --url http://127.0.0.1:8080 --verify-persistence
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down
